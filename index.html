<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텀블러 수출 대작전</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">📦</span>
      <h1>텀블러 수출 대작전</h1>
    </div>
    <div class="stats">
      <div class="stat money" title="목표 ₩10,000,000">
        <span class="stat-k">💰 예상 이익</span>
        <b class="stat-v" id="b-profit"></b>
        <small class="stat-goal">목표 ₩10,000,000</small>
      </div>
      <div class="stat trust" title="눈금(60)을 넘기면 재주문이 들어옵니다">
        <span class="stat-k">💚 신뢰</span>
        <b class="stat-v" id="b-trust-n"></b>
        <div class="bar"><i id="b-trust"></i></div>
        <small class="stat-goal">목표 60</small>
      </div>
    </div>
  </div>
</header>

<div class="game">
  <div class="side side-l">
    <nav class="panel map" aria-label="진행 단계">
      <h2 class="panel-t">🗺️ 항로</h2>
      <ol class="route" id="route"></ol>
    </nav>
  </div>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="side side-r">
    <aside class="panel ticket" aria-label="거래 조건">
      <h2 class="panel-t">🎫 거래 티켓</h2>
      <dl class="sheet" id="sheet"></dl>
      <p class="goal">🎯 목표: 이익 ₩10,000,000 지키고 신뢰 60 넘겨 재주문 받기</p>
    </aside>
    <section class="panel record-card" aria-labelledby="record-t">
      <h2 class="panel-t" id="record-t">🏆 기록</h2>
      <div id="record"></div>
    </section>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
