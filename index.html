<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 수출 한 건</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud">
  <div class="hud-in">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">📦</span>
      <div>
        <h1>첫 수출 한 건</h1>
        <p>신입 무역 담당자의 첫 거래</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat money">
        <span class="stat-k">💰 예상 이익</span>
        <b class="stat-v" id="b-profit"></b>
        <small>목표 ₩10,000,000</small>
      </div>
      <div class="stat trust">
        <span class="stat-k">💚 바이어 신뢰 <b id="b-trust-n"></b></span>
        <div class="bar" title="60을 넘기면 재주문"><i id="b-trust"></i></div>
        <small>눈금(60)을 넘기면 재주문</small>
      </div>
    </div>
  </div>
</header>

<div class="game">
  <nav class="panel map" aria-label="진행 단계">
    <h2 class="panel-t">🗺️ 항로</h2>
    <ol class="route" id="route"></ol>
  </nav>

  <main class="stage" id="stage" aria-live="polite"></main>

  <aside class="panel ticket" aria-label="거래 조건">
    <h2 class="panel-t">🎫 거래 티켓</h2>
    <dl class="sheet" id="sheet"></dl>
  </aside>
</div>
<script src="script.js"></script>
</body>
</html>
